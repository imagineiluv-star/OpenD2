name: Migration validation
on:
  push:
    branches: ["master", "feat/m0-foundation", "feat/m1-legacy-assets", "feat/m2-playable-slice"]
    paths: ["native/**", "Directory.Build.targets", "THIRD_PARTY_NOTICES.md", "src/**", "tests/**", "tools/**", "eng/**", "global.json", "Directory.Build.props", "*.sln", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ci
    secrets:
      OPEND2_ORIGINAL_SHA256SUMS:
        description: "sha256sum-style list (<hash>  <basename>, no paths) of your own install; optional, adds to the committed MPQ manifest"
        required: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: Linux
          - os: windows-2025
            preset: Windows
          - os: macos-15
            preset: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DOTNET_PROCESSOR_COUNT: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test packaging and download contracts
        run: python -m unittest discover -s eng -p "test_*.py" -v
      - name: Install bounded Linux hang diagnostics
        if: runner.os == 'Linux'
        run: |
          dotnet tool install dotnet-stack --version 10.0.750501 --tool-path "$RUNNER_TEMP/dotnet-tools"
          echo "OPEND2_STACK_TOOL=$RUNNER_TEMP/dotnet-tools/dotnet-stack" >> "$GITHUB_ENV"
      - name: Install pinned Godot and templates
        run: python eng/bootstrap.py
      - name: Stress macOS editor initialization and export teardown
        if: runner.os == 'macOS'
        run: python eng/check-editor-lifecycle.py --iterations 12
      - name: Build pinned MPQ backend from source
        run: python eng/build-native.py
      - name: Build pinned optional NPC runtime from source
        run: python eng/build-npc.py
      - name: Stamp assembly version metadata (VersionSuffix, SourceRevisionId)
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'ci' }}
        shell: bash
        run: |
          # MSBuild reads environment variables as properties, so every later dotnet build/publish picks these up.
          echo "SourceRevisionId=$GITHUB_SHA" >> "$GITHUB_ENV"
          case "$RELEASE_TAG" in
            v*-rc.*) echo "VersionSuffix=${RELEASE_TAG#*-}" >> "$GITHUB_ENV" ;;
            v*.*.*) ;;
            *) echo "VersionSuffix=ci" >> "$GITHUB_ENV" ;;
          esac
      - name: Build, contracts, headless smoke and export
        run: python eng/validate.py --export ${{ matrix.preset }}
      - name: Archive and smoke the extracted release package
        # Tagged releases REQUIRE an original-file hash list (intended). The committed MPQ manifest
        # (src/OpenD2.Assets/Manifests/d2-mpq-manifest.json, hashes only) is the default list, so no secret is needed.
        # The optional OPEND2_ORIGINAL_SHA256SUMS secret adds more hashes. Release calls get it: this guards against
        # accidents, it is not a security boundary (release.yml can be dispatched from any branch). For a hard
        # boundary, put the secret in a GitHub Environment limited to tags/master.
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'ci' }}
          SOURCE_SHA: ${{ github.sha }}
          # Injected only when called by release.yml with a real tag; push/pull_request/"ci" runs never see it.
          ORIGINAL_SHA256SUMS_CONTENT: ${{ inputs.release_tag != '' && inputs.release_tag != 'ci' && secrets.OPEND2_ORIGINAL_SHA256SUMS || '' }}
        shell: bash
        run: |
          if [ -n "$ORIGINAL_SHA256SUMS_CONTENT" ]; then
            umask 077
            sums_file="$(mktemp "$RUNNER_TEMP/original-sums.XXXXXXXX")"
            trap 'rm -f "$sums_file"' EXIT INT TERM HUP
            printf '%s\n' "$ORIGINAL_SHA256SUMS_CONTENT" > "$sums_file"
            export OPEND2_ORIGINAL_SHA256SUMS="$sums_file"
          fi
          unset ORIGINAL_SHA256SUMS_CONTENT
          python eng/release.py pack --preset ${{ matrix.preset }} --smoke
      - name: Remove hash-list temp files (self-hosted runners keep RUNNER_TEMP if the step was killed)
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/original-sums.*
      - name: Repeat Linux client initialization and audio teardown
        if: runner.os == 'Linux'
        run: python eng/smoke-export.py Linux --iterations 8
      - name: Online ownership and persistence contracts
        run: dotnet run --project tests/OpenD2.OnlineTests -c Release
      - name: Publish server and test extracted clients over HTTP and TLS
        if: runner.os != 'Linux'
        run: python eng/pack-online-server.py
      - name: Test extracted Linux clients with TLS and rendered gameplay
        if: runner.os == 'Linux'
        env:
          OPEND2_ONLINE_RENDERED: "1"
        run: xvfb-run -a -s "-screen 0 2400x1100x24" python eng/pack-online-server.py
      - name: Preserve online validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenD2-online-${{ matrix.preset }}
          path: artifacts/online/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validated online server
        uses: actions/upload-artifact@v4
        with:
          name: OpenD2-server-${{ matrix.preset }}
          path: artifacts/server-packages/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Godot validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenD2-validation-${{ matrix.preset }}
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: OpenD2-M2-${{ matrix.preset }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
